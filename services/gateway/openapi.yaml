openapi: 3.1.0
info:
  title: Smart Chain City — Gateway
  version: 0.1.0
  description: Autenticação por SIWE (EIP-4361) e JWT. Ver docs/06-modelo-dados-api.md §3.
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    Account:
      type: object
      required: [id, email, status, kyc_level, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: [string, 'null'] }
        status: { type: string, enum: [active, suspended, banned] }
        kyc_level: { type: integer }
        created_at: { type: string, format: date-time }
    Me:
      type: object
      required: [account, wallets]
      properties:
        account: { $ref: '#/components/schemas/Account' }
        wallets:
          type: array
          items:
            type: object
            required: [address, chain_id, verified_at]
            properties:
              address: { type: string }
              chain_id: { type: integer }
              verified_at: { type: string, format: date-time }
paths:
  /healthz:
    get:
      summary: Saúde do serviço
      responses:
        '200': { description: No ar }
  /v1/auth/siwe/nonce:
    post:
      summary: Gera o nonce de uso único
      responses:
        '200':
          description: Nonce para a mensagem SIWE
          content:
            application/json:
              schema:
                type: object
                required: [nonce, expires_at]
                properties:
                  nonce: { type: string }
                  expires_at: { type: string, format: date-time }
        '429': { description: Limite excedido }
  /v1/auth/siwe/verify:
    post:
      summary: Verifica a assinatura e devolve o JWT
      description: Cria a conta no primeiro login da carteira. O nonce vale uma única tentativa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, signature]
              properties:
                message: { type: string, description: Mensagem EIP-4361 completa }
                signature: { type: string, pattern: '^0x[0-9a-fA-F]+$' }
      responses:
        '200':
          description: Login aceito
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, account]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, const: Bearer }
                  expires_in: { type: integer }
                  account: { $ref: '#/components/schemas/Account' }
        '400':
          description: invalid_request, invalid_siwe_message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: invalid_siwe_domain, invalid_siwe_chain, invalid_siwe_message, invalid_nonce, invalid_signature
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: account_blocked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/auth/email/start:
    post:
      summary: Manda um código de login para o e-mail
      description: >
        Código de 6 dígitos, válido por 10 minutos. A resposta é a mesma exista a
        conta ou não. Pedir de novo antes do intervalo (60 s) não gera outro código.
        No MVP local o código sai no log do gateway.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202':
          description: Pedido aceito
          content:
            application/json:
              schema:
                type: object
                required: [expires_in]
                properties:
                  expires_in: { type: integer, description: Validade do código em segundos }
        '400':
          description: invalid_request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { description: Login por e-mail desligado (EMAIL_LOGIN=off) }
        '429': { description: Limite excedido }
  /v1/auth/email/verify:
    post:
      summary: Troca o código pelo JWT
      description: Cria a conta no primeiro login do e-mail. O código vale uma vez e queima depois de 5 erros.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Login aceito
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, account]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, const: Bearer }
                  expires_in: { type: integer }
                  account: { $ref: '#/components/schemas/Account' }
        '400':
          description: invalid_request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: invalid_code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: account_blocked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { description: Login por e-mail desligado (EMAIL_LOGIN=off) }
  /v1/me:
    get:
      summary: Conta e carteiras do jogador
      description: Avatares e saldos entram quando game-core e economy existirem.
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Conta autenticada
          content:
            application/json:
              schema:
                type: object
                required: [account, wallets]
                properties:
                  account: { $ref: '#/components/schemas/Account' }
                  wallets:
                    type: array
                    items:
                      type: object
                      required: [address, chain_id, verified_at]
                      properties:
                        address: { type: string }
                        chain_id: { type: integer }
                        verified_at: { type: string, format: date-time }
        '401':
          description: missing_credentials, invalid_token, token_expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: account_blocked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/me/wallets:
    post:
      summary: Liga mais uma carteira à conta logada
      description: >-
        Mesma mensagem e assinatura SIWE do login (pegue o nonce em /v1/auth/siwe/nonce).
        Serve para a conta de e-mail ganhar carteira. Uma carteira pertence a uma conta só.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, signature]
              properties:
                message: { type: string, maxLength: 4096 }
                signature: { type: string, pattern: '^0x[0-9a-fA-F]+$' }
      responses:
        '201':
          description: Carteira ligada; devolve a conta como no GET /v1/me
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '200':
          description: A carteira já era desta conta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400':
          description: invalid_request, invalid_siwe_message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Token (missing_credentials, invalid_token, token_expired) ou SIWE (invalid_siwe_domain, invalid_siwe_chain, invalid_nonce, invalid_signature)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: account_blocked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: wallet_in_use (a carteira é de outra conta)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/me/email/start:
    post:
      summary: Manda o código para pôr e-mail na conta logada
      description: Para a conta de carteira. Conta que já tem e-mail recebe 409 email_already_set.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202':
          description: Pedido aceito
          content:
            application/json:
              schema:
                type: object
                required: [expires_in]
                properties:
                  expires_in: { type: integer }
        '401': { description: missing_credentials, invalid_token, token_expired }
        '404': { description: Login por e-mail desligado (EMAIL_LOGIN=off) }
        '409':
          description: email_already_set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/me/email/verify:
    post:
      summary: Confere o código e grava o e-mail na conta logada
      description: Só depois do código certo o jogador fica sabendo se outra conta já usa o e-mail (409 email_in_use).
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: E-mail gravado; devolve a conta como no GET /v1/me
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { description: invalid_code, ou token inválido }
        '404': { description: Login por e-mail desligado (EMAIL_LOGIN=off) }
        '409':
          description: email_in_use, email_already_set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
