openapi: 3.1.0
info:
  title: Smart Chain City — Game core
  version: 0.1.0
  description: "Avatares, turnos, refeições, saúde, moradia, rotina, loja, negócios, fazenda, pets, campeonatos e eventos. Gerado das rotas do código e da tabela do README; o teste services/shared/test/openapi.test.ts confere que as rotas batem."
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT, description: Token de acesso do gateway }
    service: { type: apiKey, in: header, name: X-Service-Token, description: Chave entre serviços (rotas /internal) }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
paths:
  /v1/public/stats:
    get:
      summary: "Números públicos do serviço para o site"
      tags: ["public"]
      responses: {"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object"}}}},"default":{"description":"Erro","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  /healthz:
    get:
      summary: "{status"
      tags: ["operação"]
      description: "{status: \"ok\"}"
      responses: {"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object"}}}},"default":{"description":"Erro","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  /v1/catalog/professions:
    get:
      summary: "As 44 profissões com ganho do dia, duração e tarefas"
      tags: ["catalog"]
      description: "As 44 profissões com ganho do dia, duração e tarefas; das tarefas, só a direção (+/−) de energia e felicidade (GDD §2.4)"
      responses: {"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object"}}}},"default":{"description":"Erro","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  /v1/avatars:
    get:
      summary: "Avatares da conta, com atributos atuais e situação"
      tags: ["avatars"]
      security: [{"bearer":[]}]
      responses: {"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object"}}}},"default":{"description":"Erro (códigos: not_found)","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  /v1/avatars/{id}:
    get:
      summary: "Um avatar"
      tags: ["avatars"]
      description: "Um avatar; de outra conta responde 404"
      security: [{"bearer":[]}]
      parameters: [{"name":"id","in":"path","required":true,"schema":{"type":"string"}}]
      responses: {"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object"}}}},"default":{"description":"Erro","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  /v1/avatars/{id}/hospital:
    get:
