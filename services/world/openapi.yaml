      security: [{"bearer":[]}]
      parameters: [{"name":"code","in":"path","required":true,"schema":{"type":"string"}},{"name":"id","in":"path","required":true,"schema":{"type":"string"}}]
      requestBody: {"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"type":{"type":"string","maxLength":40}},"required":["type"]}}}}
      responses: {"201":{"description":"Criado","content":{"application/json":{"schema":{"type":"object"}}}},"default":{"description":"Erro (códigos: ledger_unavailable, lot_has_building)","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  /v1/world/me/properties:
