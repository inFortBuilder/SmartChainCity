openapi: 3.1.0
info:
  title: Smart Chain City — World
  version: 0.1.0
  description: "Cidades, bairros e lotes, venda de lançamento, imóveis, prédios e unidades, cotações assinadas. Gerado das rotas do código e da tabela do README; o teste services/shared/test/openapi.test.ts confere que as rotas batem."
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT, description: Token de acesso do gateway }
    service: { type: apiKey, in: header, name: X-Service-Token, description: Chave entre serviços (rotas /internal) }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
paths:
  /v1/public/stats:
    get:
      summary: "Números públicos do serviço para o site"
      tags: ["public"]
      responses: {"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object"}}}},"default":{"description":"Erro","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  /healthz:
    get:
      summary: "{status"
      tags: ["operação"]
      description: "{status: \"ok\"}"
      responses: {"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object"}}}},"default":{"description":"Erro","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  /v1/world/cities/{code}:
    get:
      summary: "Cidade, bairros abertos e contagem de vendidos por bairro"
      tags: ["cities"]
      parameters: [{"name":"code","in":"path","required":true,"schema":{"type":"string"}}]
      responses: {"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object"}}}},"default":{"description":"Erro","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  /v1/world/cities/{code}/districts/{order}/lots:
    get:
      summary: "Situação e preço dos lotes do bairro"
      tags: ["cities"]
      description: "Situação e preço dos lotes do bairro; o dono não é exposto"
      security: [{},{"bearer":[]}]
      parameters: [{"name":"code","in":"path","required":true,"schema":{"type":"string"}},{"name":"order","in":"path","required":true,"schema":{"type":"string"}}]
      responses: {"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object"}}}},"default":{"description":"Erro","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  /v1/world/cities/{code}/lots/{id}:
    get:
      summary: "Um lote"
      tags: ["cities"]
      description: "Um lote: zona, área, situação, preço em US$ e em SCITY"
      security: [{},{"bearer":[]}]
      parameters: [{"name":"code","in":"path","required":true,"schema":{"type":"string"}},{"name":"id","in":"path","required":true,"schema":{"type":"string"}}]
      responses: {"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object"}}}},"default":{"description":"Erro (códigos: not_found)","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  /v1/world/me/lots:
    get:
      summary: "Lotes do jogador"
      tags: ["me"]
      security: [{"bearer":[]}]
      responses: {"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object"}}}},"default":{"description":"Erro","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  /v1/world/cities/{code}/lots/{id}/buy:
    post:
      summary: "Compra pagando SCITY no ledger"
      tags: ["cities"]
      description: "Compra pagando SCITY no ledger. No lançamento, só na vez da fila e até o limite por carteira"
      security: [{"bearer":[]}]
      parameters: [{"name":"code","in":"path","required":true,"schema":{"type":"string"}},{"name":"id","in":"path","required":true,"schema":{"type":"string"}}]
      responses: {"201":{"description":"Criado","content":{"application/json":{"schema":{"type":"object"}}}},"default":{"description":"Erro (códigos: ledger_unavailable)","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  /v1/world/cities/{code}/sale:
    get:
      summary: "Lançamento agendado"
      tags: ["cities"]
      description: "Lançamento agendado: fase (soon, queue, launch, ended), horários, lote de entrada e limite. Com Bearer, me.ticket (waiting, admitted, expired, posição, provisional, vez e prazo) e me.bought"
      security: [{},{"bearer":[]}]
      parameters: [{"name":"code","in":"path","required":true,"schema":{"type":"string"}}]
      responses: {"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object"}}}},"default":{"description":"Erro","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  /v1/world/cities/{code}/sale/queue:
    post:
      summary: "Entra na fila"
      tags: ["cities"]
      description: "Entra na fila (ou devolve a ficha que ainda vale)"
      security: [{"bearer":[]}]
      parameters: [{"name":"code","in":"path","required":true,"schema":{"type":"string"}}]
      responses: {"201":{"description":"Criado","content":{"application/json":{"schema":{"type":"object"}}}},"default":{"description":"Erro (códigos: no_sale, wallet_required, internal_disabled)","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  /internal/v1/cities/{code}/sale:
    put:
      summary: "Agenda ou muda o lançamento"
      tags: ["interno"]
      description: "Agenda ou muda o lançamento: opens_at, ends_at, pre_queue_seconds, batch_size, batch_seconds, window_seconds, max_lots, require_wallet"
      security: [{"service":[]}]
      parameters: [{"name":"code","in":"path","required":true,"schema":{"type":"string"}}]
      requestBody: {"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"opens_at":{"type":"string","format":"date-time"},"ends_at":{"type":"string","format":"date-time"},"pre_queue_seconds":{"type":"integer","minimum":0,"maximum":86400},"batch_size":{"type":"integer","minimum":1,"maximum":100000},"batch_seconds":{"type":"integer","minimum":1,"maximum":3600},"window_seconds":{"type":"integer","minimum":60,"maximum":3600},"max_lots":{"type":"integer","minimum":1,"maximum":324},"require_wallet":{"type":"boolean"}},"required":["opens_at","ends_at"]}}}}
      responses: {"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object"}}}},"default":{"description":"Erro","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
    delete:
      summary: "Cancela o lançamento"
      tags: ["interno"]
      description: "Cancela o lançamento: a venda fica livre"
      security: [{"service":[]}]
      parameters: [{"name":"code","in":"path","required":true,"schema":{"type":"string"}}]
      responses: {"204":{"description":"Sem conteúdo"},"default":{"description":"Erro","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  /v1/world/cities/{code}/lots/{id}/onchain-quote:
    post:
      summary: "Cotação assinada para o LandNFT"
      tags: ["cities"]
      description: "Cotação assinada para o LandNFT (corpo: {wallet})"
      security: [{"bearer":[]}]
      parameters: [{"name":"code","in":"path","required":true,"schema":{"type":"string"}},{"name":"id","in":"path","required":true,"schema":{"type":"string"}}]
      requestBody: {"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"wallet":{"type":"string"}},"required":["wallet"]}}}}
      responses: {"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object"}}}},"default":{"description":"Erro (códigos: onchain_disabled, properties_disabled, ledger_unavailable)","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  /v1/world/property-types:
    get:
      summary: "Tipos de imóvel, preço, obra, renda por nível e regras de desgaste e acúmulo"
      tags: ["property-types"]
      description: "Tipos de imóvel, preço, obra, renda por nível e regras de desgaste e acúmulo; nos negócios de lazer, venue com a atividade e a entrada"
      responses: {"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object"}}}},"default":{"description":"Erro","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  /v1/world/cities/{code}/venues:
    get:
      summary: "Academias e galerias da cidade"
      tags: ["cities"]
      description: "Academias e galerias da cidade: tipo, lote, entrada, open e fase"
      security: [{},{"bearer":[]}]
      parameters: [{"name":"code","in":"path","required":true,"schema":{"type":"string"}}]
      responses: {"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object"}}}},"default":{"description":"Erro","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  /internal/v1/venues/{id}:
    get:
      summary: "O negócio para o game-core cobrar a entrada"
