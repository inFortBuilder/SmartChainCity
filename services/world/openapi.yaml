      description: "O negócio para o game-core cobrar a entrada: dono, atividade, entrada e se está aberto"
      security: [{"service":[]}]
      parameters: [{"name":"id","in":"path","required":true,"schema":{"type":"string"}}]
      responses: {"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object"}}}},"default":{"description":"Erro (códigos: internal_disabled, not_found)","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  /v1/world/cities/{code}/lots/{id}/property:
