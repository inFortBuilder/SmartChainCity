openapi: 3.1.0
info:
  title: Smart Chain City — Realtime
  version: 0.1.0
  description: "Colyseus: salas por bairro (WebSocket), presença, chat e eventos ao vivo. Aqui só as rotas HTTP; as salas ficam no README. Gerado das rotas do código e da tabela do README; o teste services/shared/test/openapi.test.ts confere que as rotas batem."
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT, description: Token de acesso do gateway }
    service: { type: apiKey, in: header, name: X-Service-Token, description: Chave entre serviços (rotas /internal) }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
paths:
  /healthz:
    get:
      summary: "Saúde do serviço"
      tags: ["operação"]
      responses: {"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object"}}}},"default":{"description":"Erro","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  /v1/realtime/rooms:
    get:
      summary: "Salas abertas por bairro, com a lotação"
      tags: ["rooms"]
      responses: {"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object"}}}},"default":{"description":"Erro","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  /internal/v1/broadcast:
    post:
      summary: "Evento da Prefeitura para as salas"
      tags: ["interno"]
      description: "Evento da Prefeitura para as salas (todas, de uma cidade ou de um bairro)"
      security: [{"service":[]}]
      responses: {"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object"}}}},"default":{"description":"Erro","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
  /v1/realtime/schedule:
    get:
      summary: "Agenda das próximas 48 h"
      tags: ["schedule"]
      description: "Agenda das próximas 48 h: dirigível e datas marcadas"
      responses: {"200":{"description":"OK","content":{"application/json":{"schema":{"type":"object"}}}},"default":{"description":"Erro","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}}}
