# Painel local de observabilidade (E1.7): Prometheus lê o /metrics dos
# serviços que rodam no host; Grafana mostra requisições, erros e latência
# por serviço. Só escuta em 127.0.0.1.
#
#   docker compose -f infra/observability/docker-compose.yml up -d
#   Grafana: http://localhost:3001 (entra sem login, só leitura)
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alertas.yml:/etc/prometheus/alertas.yml:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - '127.0.0.1:9090:9090'

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/servicos.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    ports:
      - '127.0.0.1:3001:3000'
