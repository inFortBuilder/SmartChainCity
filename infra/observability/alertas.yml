# Alertas de base (E1.7). Os limites são de partida; ajustar com tráfego real.
groups:
  - name: servicos
    rules:
      - alert: ServicoFora
        expr: up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: '{{ $labels.instancia }} não responde ao /metrics há 1 minuto'
      - alert: Erros5xx
        expr: sum by (service) (rate(http_requests_total{status=~"5.."}[5m])) / sum by (service) (rate(http_requests_total[5m])) > 0.02
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: '{{ $labels.service }} com mais de 2% de respostas 5xx'
      - alert: LatenciaP95Alta
        expr: histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: '{{ $labels.service }} com p95 acima de 1 s'

  # Economia (E2.8): medidores do economy, recalculados a cada minuto (job economy.panel).
  - name: economia
    rules:
      - alert: DrenoAbaixoDaMeta
        expr: economy_sink_ratio{currency="THALER",window="7d"} < 0.55 and economy_faucet_units{currency="THALER",window="7d"} >= 1000
        for: 6h
        labels: { severity: warning }
        annotations:
          summary: 'Dreno de THALER abaixo de 55% da emissão em 7 dias (meta do doc 04)'
      - alert: PoolP2EAcabando
        expr: economy_p2e_runway_days{currency="THALER"} < 30
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: 'Pool P2E acaba em {{ $value }} dias no ritmo da última semana'
      - alert: PoolP2ECritico
        expr: economy_p2e_runway_days{currency="THALER"} < 7
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: 'Pool P2E acaba em menos de 7 dias ({{ $value }})'

  # Incidentes (E4.6): trava ligada é decisão da operação, mas não pode ser esquecida ligada.
  - name: incidentes
    rules:
      - alert: TravaDeIncidenteLigada
        expr: max by (switch) (economy_incident_switch) == 1
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: 'Trava de incidente "{{ $labels.switch }}" ligada no economy (runbook em docs/incidentes)'
      - alert: TravaLigadaHaMaisDe24h
        expr: max by (switch) (economy_incident_switch) == 1
        for: 24h
        labels: { severity: critical }
        annotations:
          summary: 'Trava "{{ $labels.switch }}" ligada há mais de 24 h: rever o incidente e comunicar a comunidade'
