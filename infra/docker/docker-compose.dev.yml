# Serviços de desenvolvimento. A porta 5433 evita conflito com um Postgres local,
# e a URL é a mesma do `pnpm db:up`: use um ou outro, não os dois ao mesmo tempo.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scc
      POSTGRES_PASSWORD: scc_dev
      POSTGRES_DB: scc
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scc -d scc']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'

volumes:
  postgres_data:
