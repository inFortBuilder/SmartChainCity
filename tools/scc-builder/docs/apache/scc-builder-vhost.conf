# ════════════════════════════════════════════════════════════════════════
#  SCC Builder — VirtualHost de exemplo
#
#  Use quando quiser um domínio próprio (scc-builder.local ou um domínio
#  real) em vez do subdiretório http://localhost/scc-builder/.
#
#  WAMP: adicione o conteúdo em
#    C:\wamp64\bin\apache\apache2.4.x\conf\extra\httpd-vhosts.conf
#  e registre o host em C:\Windows\System32\drivers\etc\hosts:
#    127.0.0.1  scc-builder.local
# ════════════════════════════════════════════════════════════════════════

<VirtualHost *:80>
    ServerName scc-builder.local
    ServerAdmin admin@localhost

    # A raiz aponta para o BUILD, não para a pasta do projeto.
    # Assim o código-fonte fica inacessível por HTTP por construção,
    # não por regra de bloqueio.
    DocumentRoot "C:/wamp64/www/scc-builder/dist"

    <Directory "C:/wamp64/www/scc-builder/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # SPA: qualquer rota desconhecida devolve o index.html
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^ index.html [L]
        </IfModule>
    </Directory>

    # A API é montada por Alias, fora do DocumentRoot.
    Alias /api "C:/wamp64/www/scc-builder/api"

    <Directory "C:/wamp64/www/scc-builder/api">
        Options -Indexes
        AllowOverride All
        Require all granted

        # A configuração com as chaves nunca pode ser servida.
        <FilesMatch "^config\.local.*\.php$">
            Require all denied
        </FilesMatch>
    </Directory>

    # As classes internas não são endpoints.
    <Directory "C:/wamp64/www/scc-builder/api/lib">
        Require all denied
    </Directory>

    # Limites de upload
    <IfModule mod_php.c>
        php_value upload_max_filesize 512M
        php_value post_max_size 512M
        php_value max_execution_time 300
        php_value memory_limit 512M
    </IfModule>

    ErrorLog  "${INSTALL_DIR}/logs/scc-builder-error.log"
    CustomLog "${INSTALL_DIR}/logs/scc-builder-access.log" common
</VirtualHost>


