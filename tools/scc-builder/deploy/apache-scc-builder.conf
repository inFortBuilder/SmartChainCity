# VirtualHost do contêiner: a raiz do projeto é o DocumentRoot e o
# .htaccess (versionado) faz o roteamento e os bloqueios.
<VirtualHost *:80>
    DocumentRoot /var/www/scc-builder

    <Directory /var/www/scc-builder>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
