<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cidade de Pittsburg — Protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=3">
<style>
  .layers { position: fixed; left: 16px; top: calc(var(--topbar-h, 64px) + 32px); z-index: 5; padding: 14px 16px; width: 200px; border-radius: var(--radius); }
  .layers h2 { margin: 0; font-size: 14px; }
  .cortina-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .layers label { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 3px 0; cursor: pointer; }
  .layers p { margin: 10px 0 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
  .ficha { position: fixed; right: 16px; top: calc(var(--topbar-h, 64px) + 32px); z-index: 5; padding: 14px 16px; width: 240px; border-radius: var(--radius); }
  .ficha h2 { margin: 0 0 8px; font-size: 15px; }
  .ficha dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 0; font-size: 13px; }
  .ficha dt { color: var(--muted); }
  .ficha dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .credito { position: fixed; right: 12px; bottom: 8px; z-index: 5; font-size: 11px; color: #1e293b; background: rgba(255,255,255,.7); padding: 2px 6px; border-radius: 6px; }
  .aviso { position: fixed; inset: 0; display: grid; place-items: center; z-index: 9; text-align: center; padding: 24px; }
  .aviso div { max-width: 480px; padding: 20px 24px; border-radius: var(--radius); line-height: 1.5; }
  .aviso code { font-size: 12px; word-break: break-all; }
  .hud { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .hud select.chip { border: 0; color: var(--text); cursor: pointer; }
  .hud select.chip option { color: #0b1220; }
  .chip--scity { color: #fbbf24; }
  .chip--thaler { color: #8ddc0e; }
  .topbar { height: auto; min-height: 64px; padding: 8px 14px; flex-wrap: wrap; }
  .ficha { max-height: calc(100vh - var(--topbar-h, 64px) - 56px); overflow-y: auto; width: 300px; }
  /* A ficha aberta fica acima do chat do bairro: senão, o fim dela (vender, convidar) fica embaixo do painel. */
  .ficha { z-index: 8; }
  .gestao { margin-top: 12px; border-top: 1px solid var(--glass-border); padding-top: 10px; }
  .gestao h3 { margin: 4px 0 6px; font-size: 14px; }
  .gestao p { font-size: 12px; margin: 6px 0; }
  .negocio { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 8px; margin: 6px 0; border-radius: 10px; background: rgba(255,255,255,.05); }
  .negocio strong { display: block; font-size: 13px; }
  .negocio small { display: block; color: var(--muted); font-size: 11px; line-height: 1.4; }
  .negocio .motivo { color: #fca5a5; }
  .negocio--off { opacity: .55; }
  .negocio .btn:disabled { opacity: .45; cursor: not-allowed; }
  .barra { height: 8px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; margin: 6px 0; }
  .barra span { display: block; height: 100%; background: linear-gradient(90deg, #22d3ee, #8ddc0e); }
  .pequeno { font-size: 12px !important; }
  .patrimonio { position: fixed; left: 16px; top: calc(var(--topbar-h, 64px) + 32px); z-index: 5; width: 320px; max-height: calc(100vh - var(--topbar-h, 64px) - 56px); overflow-y: auto; padding: 14px 16px; border-radius: var(--radius); }
  .patrimonio h2 { margin: 0; font-size: 16px; }
  .patrimonio .linha { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .patrimonio .resumo { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 10px 0; font-size: 13px; }
  .patrimonio .resumo dt { color: var(--muted); }
  .patrimonio .resumo dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .patrimonio ul { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
  .patrimonio li { display: grid; gap: 6px; padding: 10px; border-radius: 10px; background: rgba(255,255,255,.05); font-size: 13px; }
  .patrimonio .btn--primary.pequeno { width: auto; margin: 0; padding: 7px 10px; }
  .modelo { margin: 8px 0 12px; padding: 10px; border-radius: 10px; background: rgba(34,211,238,.08); border: 1px solid rgba(34,211,238,.35); }
  .modelo h3 { margin: 0 0 4px; }
  .gestao .motivo { color: #fca5a5; }
  .toast { position: fixed; left: 50%; top: calc(var(--topbar-h, 64px) + 40px); transform: translateX(-50%); padding: 12px 18px; z-index: 8; font-weight: 600; max-width: 90vw; }
  /* Multiplayer (E2.7): chat e jogadores do bairro, no canto inferior direito. */
  .multiplayer { position: fixed; right: 16px; bottom: 40px; z-index: 6; width: 300px; padding: 12px 14px; border-radius: var(--radius); font-size: 13px; }
  .multiplayer .cab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .multiplayer h2 { margin: 0; font-size: 15px; }
  .multiplayer .mp-chat { list-style: none; margin: 8px 0; padding: 0; max-height: 22vh; overflow-y: auto; display: grid; gap: 4px; }
  .multiplayer .mp-chat li { line-height: 1.35; overflow-wrap: anywhere; }
  .multiplayer .mp-chat li.meu b { color: #a5f3fc; }
  .multiplayer .mp-chat li.evento { color: #fde68a; }
  .multiplayer form { display: flex; gap: 6px; margin: 0; }
  .multiplayer form .campo { flex: 1; min-width: 0; background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.14); border-radius: 8px; padding: 7px 9px; color: var(--text); }
  .multiplayer [data-mp-status]:empty { display: none; }
  @media (max-width: 640px) { .multiplayer { right: 8px; left: 8px; width: auto; bottom: 8px; } }
  .servidor { position: fixed; left: 16px; bottom: 40px; z-index: 6; width: 300px; max-height: 48vh; overflow-y: auto; padding: 12px 14px; border-radius: var(--radius); font-size: 13px; }
  .servidor h2 { margin: 0; font-size: 15px; }
  /* Moradia (servidor.js): as opções quebram a linha; os dias ficam numa linha própria. */
  .moradia-opcoes { flex-wrap: wrap; }
  .moradia-dias { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .moradia-dias select.campo { width: auto; }
  .moradia-dias select.campo option { color: #111; }
  /* Minigame do turno (E2.2): tarefas feitas, em andamento e próximas. */
  .servidor .minigame { list-style: none; margin: 6px 0; padding: 0; display: grid; gap: 3px; font-size: 12px; }
  .servidor .minigame li { display: flex; justify-content: space-between; gap: 8px; }
  .servidor .lista-saques { list-style: none; margin: 6px 0; padding: 0; display: grid; gap: 4px; font-size: 12px; }
  .lista { list-style: none; margin: 6px 0; padding: 0; display: grid; gap: 4px; font-size: 12px; }
  .lista li { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .servidor .lista-saques li { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .servidor form.banco { display: grid; gap: 6px; margin: 6px 0; }
  .servidor form.banco .campo { width: 100%; box-sizing: border-box; }
  .servidor form.banco .btn { white-space: nowrap; }
  .servidor .tarefa--feita { opacity: .6; }
  .servidor .tarefa--agora { color: #fde68a; font-weight: 600; }
  .servidor .tarefa--depois { opacity: .85; }
  .servidor h3 { margin: 10px 0 4px; font-size: 13px; }
  .servidor p { margin: 6px 0; }
  .servidor .linha { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin: 8px 0; }
  .servidor .linha .btn { flex: 1; margin: 0; }
  .servidor .cab .btn { flex: 0 0 auto; width: auto; padding: 4px 10px; }
  .chip .demo { font-size: 10px; opacity: .7; margin-left: 4px; text-transform: uppercase; letter-spacing: .04em; }
  .servidor .btn--primary, .servidor .btn--blue { width: 100%; margin: 6px 0 0; }
  .servidor .attr { display: grid; grid-template-columns: 82px 1fr 18px; gap: 6px; align-items: center; font-size: 12px; }
  .servidor .attr .barra { margin: 2px 0; }
  .servidor .attr b { text-align: right; font-variant-numeric: tabular-nums; }
  .servidor .resumo { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; margin: 8px 0; }
  .servidor .resumo dt { color: var(--muted); }
  .servidor .resumo dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .servidor .aviso-s { color: #fca5a5; font-size: 12px; }
  .servidor .ok-s { color: #8ddc0e; font-size: 12px; font-weight: 600; }
  .servidor code { font-size: 11px; }
  .servidor .campo { flex: 1; min-width: 0; background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.14); border-radius: 8px; padding: 7px 9px; color: var(--text); }
  .servidor form { margin: 0; }
  .servidor .comer .linha .campo { flex: 3; }
  .servidor select.campo option { color: #111; }
  .srv-obra select.campo { max-width: 100%; }
  .srv-obra select.campo option { color: #111; }
  .srv-obra .srv-lista { list-style: none; margin: 6px 0; padding: 0; display: grid; gap: 6px; }
  .srv-obra .srv-lista li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .srv-obra .srv-lista .btn { margin-left: auto; }
  .tag--srv, .tag-srv { background: rgba(139,92,246,.25); color: #c4b5fd; border-radius: 999px; padding: 1px 8px; font-size: 11px; }
  .servidor > .btn--ghost:only-child { margin: 0; }
  @media (max-width: 640px) { .layers { top: auto; bottom: 16px; left: 8px; width: 150px; } .ficha { right: 8px; width: 190px; } }
  /* Cortinas laterais (cortinas.js): Jogo e Camadas ocupam da barra do topo até a base da tela, à esquerda,
     com a rolagem do lado esquerdo. Fechadas, saem da tela; as abas na borda abrem e fecham. */
  :root { --trilho: 46px; --cortina-topo: calc(var(--topbar-fim, 80px) + 10px); }
  .cortina-trilho { position: fixed; left: 0; top: calc(var(--topbar-fim, 80px) + 40px); z-index: 6; display: flex; flex-direction: column; gap: 8px; padding-left: 4px; }
  .cortina-aba { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 38px; padding: 10px 0; border-radius: 0 12px 12px 0; border-left: 0; color: var(--text); cursor: pointer; font: 600 12px/1 Inter, system-ui, sans-serif; }
  .cortina-aba__txt { writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: .04em; }
  .cortina-aba.is-active { background: rgba(34,211,238,.28); border-color: rgba(34,211,238,.6); }
  .cortina-aba:focus-visible { outline: 2px solid #22d3ee; outline-offset: 2px; }
  .layers.cortina, .servidor.cortina {
    /* Colada na borda esquerda e acima das abas: aberta, cobre as abas (fecha pelo botão no cabeçalho ou Esc). */
    position: fixed; left: 0; right: auto; top: var(--cortina-topo); bottom: 0;
    width: 340px; max-width: calc(100vw - 8px); max-height: none; margin: 0;
    border-left: 0; border-radius: 0 var(--radius) 0 0; overflow-y: auto; overscroll-behavior: contain; z-index: 8;
    /* Rolagem à esquerda: o contêiner é rtl e o conteúdo volta a ltr. */
    direction: rtl; padding: 14px 16px 18px;
    transform: translateX(-105%); transition: transform .22s ease, visibility .22s;
    visibility: hidden;
  }
  .layers.cortina { width: 260px; }
  .cortina > * { direction: ltr; }
  .cortina.cortina--aberta { transform: none; visibility: visible; }
  .cortina::-webkit-scrollbar { width: 8px; }
  .cortina::-webkit-scrollbar-thumb { background: rgba(255,255,255,.22); border-radius: 999px; }
  /* "Meu patrimônio" abre ao lado das abas, sem cobrir o trilho. */
  .patrimonio { left: calc(var(--trilho) + 8px); }
  body.sv-on .cortina-trilho { display: none !important; }
  /* Ficha do lote: cortina lateral à direita, no mesmo formato das da esquerda (do menu do topo à base da tela). */
  .ficha.glass {
    position: fixed; right: 0; left: auto; top: var(--cortina-topo); bottom: 0;
    width: 320px; max-width: calc(100vw - 8px); max-height: none; margin: 0;
    border-right: 0; border-radius: var(--radius) 0 0 0; overflow-y: auto; overscroll-behavior: contain; z-index: 8;
    padding: 14px 16px 18px; animation: ficha-entra .2s ease;
  }
  .ficha .cortina-cab h2 { margin: 0; }
  .ficha::-webkit-scrollbar { width: 8px; }
  .ficha::-webkit-scrollbar-thumb { background: rgba(255,255,255,.22); border-radius: 999px; }
  @keyframes ficha-entra { from { transform: translateX(100%); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .ficha.glass { animation: none; } }
  @media (prefers-reduced-motion: reduce) { .layers.cortina, .servidor.cortina { transition: none; } }
  @media (max-width: 640px) {
    .layers.cortina, .servidor.cortina, .ficha.glass { width: calc(100vw - 8px); }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene" aria-label="Cidade de Pittsburg em 3D"></canvas>

<header class="topbar glass">
  <img class="logo" src="../../website/public/assets/img/brand/logo-3d-260.webp" alt="Smart Chain City" width="120" height="62">
  <strong>Pittsburg, Califórnia</strong>
  <span data-resumo class="muted"></span>
</header>

<aside class="layers glass">
  <div class="cortina-cab"><h2>🗺️ Camadas</h2><button class="btn btn--ghost" type="button" data-cortina-fechar aria-label="Fechar camadas">–</button></div>
  <div data-layers></div>
  <p>Arraste para girar. Clique direito para mover. Clique num lote verde para comprar; no seu lote (ciano), abra um negócio. Cinza = bairro que ainda não abriu. "Meu patrimônio" lista tudo o que é seu.</p>
</aside>

<aside class="ficha glass" data-ficha hidden></aside>
<div class="credito">© OpenStreetMap contributors</div>
<div class="aviso" data-aviso><div class="glass">Carregando a cidade…</div></div>

<script type="module" src="pittsburg.js"></script>
</body>
</html>
