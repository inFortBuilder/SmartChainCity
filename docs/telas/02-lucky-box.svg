<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Tela 02 — Lucky Box e seleção de avatar</title>
  <defs>
    <style>
      @font-face { font-family: "Londrina Solid"; src: url("../../website/public/assets/fonts/LondrinaSolid-Black.ttf"); font-weight: 900; }
      @font-face { font-family: "Baloo 2"; src: url("../../website/public/assets/fonts/Baloo2-VariableFont_wght.ttf"); font-weight: 400 800; }
      .t { font-family: "Londrina Solid", "Arial Black", sans-serif; font-weight: 900; }
      .b { font-family: "Baloo 2", Arial, sans-serif; font-weight: 700; }
      .lbl { font-family: "Baloo 2", Arial, sans-serif; font-weight: 800; font-size: 20px; fill: #fff; text-anchor: middle; paint-order: stroke; stroke: rgba(0,0,0,.45); stroke-width: 4px; }
    </style>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ec3f2"/><stop offset="1" stop-color="#e3f5ff"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcbcbc"/><stop offset="1" stop-color="#909090"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9be81d"/><stop offset="1" stop-color="#55b51b"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d8cf0"/><stop offset="1" stop-color="#1442a8"/></linearGradient>
    <linearGradient id="cardblue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2ec0f5"/><stop offset="1" stop-color="#1b5fd0"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc35a"/><stop offset="1" stop-color="#f07b12"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bf7df5"/><stop offset="1" stop-color="#6b2bc4"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe07a"/><stop offset="1" stop-color="#e88a0c"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b5ec4f"/><stop offset="1" stop-color="#7cc813"/></linearGradient>
    <radialGradient id="coin" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ffd56b"/><stop offset=".7" stop-color="#f39a1e"/><stop offset="1" stop-color="#c4650a"/></radialGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#000" flood-opacity=".2"/></filter>
    <symbol id="i-user" viewBox="0 0 24 24"><path fill="#fff" d="M12 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm-9 9a9 9 0 0 1 18 0v1H3v-1Z"/></symbol>
    <symbol id="i-cash" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="3" fill="#fff"/><circle cx="12" cy="12" r="3.2" fill="#275e12"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path fill="#fff" d="M12 3 2 11h3v10h5v-6h4v6h5V11h3L12 3Z"/></symbol>
    <symbol id="i-build" viewBox="0 0 24 24"><path fill="#fff" d="M4 3h16v18h-6v-4h-4v4H4V3Zm3 3v2h2V6H7Zm4 0v2h2V6h-2Zm4 0v2h2V6h-2ZM7 10v2h2v-2H7Zm4 0v2h2v-2h-2Zm4 0v2h2v-2h-2Z"/></symbol>
    <symbol id="i-car" viewBox="0 0 24 24"><path fill="#fff" d="M5 11 7 5h10l2 6h1v7h-3v-2H7v2H4v-7h1Zm2.5 0h9l-1.2-4H8.7L7.5 11Z"/></symbol>
    <symbol id="i-tree" viewBox="0 0 24 24"><path fill="#fff" d="M12 2a7 7 0 0 1 4.6 12.3A5 5 0 0 1 13 16v6h-2v-6a5 5 0 0 1-3.6-1.7A7 7 0 0 1 12 2Z"/></symbol>
    <symbol id="i-cap" viewBox="0 0 24 24"><path fill="#fff" d="M12 4 1 9l11 5 9-4.1V16h2V9L12 4Zm-6 9.2V17c0 1.7 2.7 3 6 3s6-1.3 6-3v-3.8l-6 2.8-6-2.8Z"/></symbol>
    <symbol id="i-tie" viewBox="0 0 24 24"><path fill="#fff" d="M9 2h6l-1.5 3 2.5 11-4 6-4-6 2.5-11L9 2Z"/></symbol>
    <symbol id="i-shirt" viewBox="0 0 24 24"><path fill="#fff" d="M8 3 2 6l2 5 2-1v11h12V10l2 1 2-5-6-3a4 4 0 0 1-8 0Z"/></symbol>
    <symbol id="i-food" viewBox="0 0 24 24"><path fill="#fff" d="M6 2h1.5v6H9V2h1.5v6H12V2h1v7a3 3 0 0 1-2.5 3V22h-2V12A3 3 0 0 1 6 9V2Zm11 0c1.7 0 3 2.7 3 6v4h-2v10h-2V2h1Z"/></symbol>
    <symbol id="i-paw" viewBox="0 0 24 24"><path fill="#fff" d="M12 12c3 0 6 4 6 6.5 0 1.5-1.3 2.5-3 2.5-1.2 0-2-.6-3-.6s-1.8.6-3 .6c-1.7 0-3-1-3-2.5C6 16 9 12 12 12ZM5 8a2 2.5 0 1 1 0 5 2 2.5 0 0 1 0-5Zm14 0a2 2.5 0 1 1 0 5 2 2.5 0 0 1 0-5ZM9 3a2 2.5 0 1 1 0 5 2 2.5 0 0 1 0-5Zm6 0a2 2.5 0 1 1 0 5 2 2.5 0 0 1 0-5Z"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="2"/><ellipse cx="12" cy="12" rx="4" ry="9" fill="none" stroke="#fff" stroke-width="2"/><path d="M3 12h18" stroke="#fff" stroke-width="2"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path fill="#fff" d="M9 3 3 5v16l6-2 6 2 6-2V3l-6 2-6-2Zm0 2.2 6 2v11.6l-6-2V5.2Z"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><path fill="#fff" d="M2 5h20v14H2V5Zm2 2v.5l8 5 8-5V7H4Zm16 2.8-8 5-8-5V17h16V9.8Z"/></symbol>
    <symbol id="i-party" viewBox="0 0 24 24"><path fill="#fff" d="M3 21 8 7l9 9-14 5Zm11-17 1-2 1 2 2 1-2 1-1 2-1-2-2-1 2-1Zm5 6 .7-1.4L21 8l-1.3-.6L19 6l-.7 1.4L17 8l1.3.6.7 1.4Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path fill="#fff" d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6V3Z"/></symbol>
    <symbol id="i-smile" viewBox="0 0 24 24"><path fill="#fff" d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm-3.5 7a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm7 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3ZM7 14c1 2.2 2.8 3.5 5 3.5s4-1.3 5-3.5H7Z"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path fill="#fff" d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path fill="#fff" d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4 6.4 5Z"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><path fill="#fff" d="M3 3h2.5l2.6 11.5h10.4L21 7H7.1l-.5-2H21V3H3Zm6 15a2 2 0 1 1 0 4 2 2 0 0 1 0-4Zm9 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path fill="#fff" d="M7 4 2 9l5 5v-3.5h9v-3H7V4Zm10 6v3.5H8v3h9V20l5-5-5-5Z"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path fill="#fff" d="M3 8h18v4H3V8Zm1 5h7v8H4v-8Zm9 0h7v8h-7v-8ZM12 8c-1-3-4-5-6-3s1 3 6 3Zm0 0c1-3 4-5 6-3s-1 3-6 3Z"/></symbol>
    <symbol id="coinS" viewBox="0 0 60 60"><circle cx="30" cy="30" r="28" fill="url(#coin)" stroke="#b25a08" stroke-width="3"/><circle cx="30" cy="30" r="20" fill="none" stroke="#ffe39b" stroke-width="2.5" opacity=".8"/><path d="M34 19c-2-1.5-9-2-9.5 2.5S35 26 35 31.5 27 39 24 37" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M30 15v30" stroke="#fff" stroke-width="3"/></symbol>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect y="880" width="1920" height="200" fill="#5db82e"/>
  <text x="960" y="110" text-anchor="middle" class="t" font-size="72" fill="#0b4f7a">ABRA SUA LUCKY BOX</text>
  <text x="960" y="160" text-anchor="middle" class="b" font-size="28" fill="#0b4f7a">A raridade da caixa muda as chances de cada raridade de smartcityano.</text>

  <!-- 4 caixas por tier -->
  <g class="t" text-anchor="middle">
    <g transform="translate(210 220)" filter="url(#sh)">
      <rect width="330" height="420" rx="26" fill="url(#lime)" stroke="#fff" stroke-width="8"/>
      <rect x="85" y="80" width="160" height="130" rx="14" fill="#275e12"/><rect x="70" y="60" width="190" height="40" rx="10" fill="#3e8a1a"/><rect x="152" y="60" width="26" height="150" fill="#ffd23a"/>
      <text x="165" y="270" font-size="46" fill="#123d06">COMUM</text>
      <text x="165" y="310" class="b" font-size="22" fill="#123d06">Comum 70% · Raro 25% · Épico 5%</text>
      <rect x="55" y="335" width="220" height="60" rx="16" fill="#275e12"/><text x="165" y="377" font-size="32" fill="#fff">150 BUSD</text>
    </g>
    <g transform="translate(570 220)" filter="url(#sh)">
      <rect width="330" height="420" rx="26" fill="url(#blue)" stroke="#fff" stroke-width="8"/>
      <rect x="85" y="80" width="160" height="130" rx="14" fill="#123a8e"/><rect x="70" y="60" width="190" height="40" rx="10" fill="#1d55c4"/><rect x="152" y="60" width="26" height="150" fill="#ffd23a"/>
      <text x="165" y="270" font-size="46" fill="#fff">RARA</text>
      <text x="165" y="310" class="b" font-size="22" fill="#fff">Raro 60% · Épico 30% · Lend. 10%</text>
      <rect x="55" y="335" width="220" height="60" rx="16" fill="#123a8e"/><text x="165" y="377" font-size="32" fill="#fff">200 BUSD</text>
    </g>
    <g transform="translate(930 220)" filter="url(#sh)">
      <rect width="330" height="420" rx="26" fill="url(#purple)" stroke="#fff" stroke-width="8"/>
      <rect x="85" y="80" width="160" height="130" rx="14" fill="#4a1a8e"/><rect x="70" y="60" width="190" height="40" rx="10" fill="#5e22b0"/><rect x="152" y="60" width="26" height="150" fill="#ffd23a"/>
      <text x="165" y="270" font-size="46" fill="#fff">ÉPICA</text>
      <text x="165" y="310" class="b" font-size="22" fill="#fff">Épico 70% · Lendário 30%</text>
      <rect x="55" y="335" width="220" height="60" rx="16" fill="#4a1a8e"/><text x="165" y="377" font-size="32" fill="#fff">250 BUSD</text>
    </g>
    <g transform="translate(1290 220)" filter="url(#sh)">
      <rect width="330" height="420" rx="26" fill="url(#gold)" stroke="#fff" stroke-width="8"/>
      <rect x="85" y="80" width="160" height="130" rx="14" fill="#a85a06"/><rect x="70" y="60" width="190" height="40" rx="10" fill="#c97208"/><rect x="152" y="60" width="26" height="150" fill="#fff4c2"/>
      <text x="165" y="270" font-size="46" fill="#5a2e02">LENDÁRIA</text>
      <text x="165" y="310" class="b" font-size="22" fill="#5a2e02">Lendário 100%</text>
      <rect x="55" y="335" width="220" height="60" rx="16" fill="#a85a06"/><text x="165" y="377" font-size="32" fill="#fff">300 BUSD</text>
    </g>
  </g>
  <text x="960" y="690" text-anchor="middle" class="b" font-size="22" fill="#0b4f7a">Probabilidades ilustrativas — os valores oficiais ficam públicos no contrato LuckyBox (docs/07 §2.3).</text>

  <!-- Seus avatares -->
  <g filter="url(#sh)">
    <rect x="210" y="720" width="1500" height="300" rx="26" fill="#e3e3e3" stroke="#a9a9a9" stroke-width="7"/>
  </g>
  <text x="250" y="775" class="t" font-size="38" fill="#3a3a3a">SEUS SMARTCITYANOS (2/3)</text>
  <g class="t" text-anchor="middle">
    <g transform="translate(250 795)">
      <rect width="190" height="200" rx="16" fill="url(#gold)" stroke="#fff" stroke-width="5"/>
      <rect x="20" y="16" width="150" height="118" rx="10" fill="#bfe5ff"/><use href="#i-user" x="50" y="26" width="90" height="100" opacity=".55"/>
      <text x="95" y="166" font-size="28" fill="#fff">MÉDICO</text><text x="95" y="190" class="b" font-size="16" fill="#fff">Lendário · 250/dia</text>
    </g>
    <g transform="translate(470 795)">
      <rect width="190" height="200" rx="16" fill="url(#lime)" stroke="#fff" stroke-width="5"/>
      <rect x="20" y="16" width="150" height="118" rx="10" fill="#bfe5ff"/><use href="#i-user" x="50" y="26" width="90" height="100" opacity=".55"/>
      <text x="95" y="166" font-size="28" fill="#123d06">PADEIRO</text><text x="95" y="190" class="b" font-size="16" fill="#123d06">Comum · 125/dia</text>
    </g>
    <g transform="translate(690 795)">
      <rect width="190" height="200" rx="16" fill="none" stroke="#9a9a9a" stroke-width="5" stroke-dasharray="14 10"/>
      <text x="95" y="112" font-size="70" fill="#9a9a9a">+</text><text x="95" y="160" class="b" font-size="18" fill="#7a7a7a">Vaga livre</text>
    </g>
  </g>
  <!-- detalhe do avatar selecionado -->
  <text x="960" y="835" class="t" font-size="36" fill="#3a3a3a">MÉDICO · LENDÁRIO</text>
  <text x="960" y="872" class="b" font-size="22" fill="#555">Ganho base 225–250 THALER/dia · Turno de 6 ou 12 horas</text>
  <text x="960" y="906" class="b" font-size="22" fill="#555">Atributos: Saúde 10 · Felicidade 10 · Energia 10 · Educação 0/100</text>
  <g filter="url(#sh)">
    <rect x="960" y="930" width="300" height="70" rx="18" fill="url(#green)"/><text x="1110" y="978" text-anchor="middle" class="t" font-size="34" fill="#123d06">JOGAR COM ELE</text>
    <rect x="1280" y="930" width="250" height="70" rx="18" fill="url(#blue)"/><text x="1405" y="978" text-anchor="middle" class="t" font-size="30" fill="#fff">VER NO MARKET</text>
  </g>
</svg>
