<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telas do Jogo — Smart Chain City</title>
<style>
  @font-face { font-family: "Londrina Solid"; src: url("../../website/public/assets/fonts/LondrinaSolid-Black.ttf"); font-weight: 900; }
  @font-face { font-family: "Baloo 2"; src: url("../../website/public/assets/fonts/Baloo2-VariableFont_wght.ttf"); font-weight: 400 800; }
  :root { color-scheme: light; }
  body { margin: 0; background: #0b2a1a; color: #fff; font-family: "Baloo 2", system-ui, sans-serif; }
  header { padding: 24px 16px 8px; text-align: center; }
  h1 { font-family: "Londrina Solid", sans-serif; font-size: 2.6rem; margin: 0; }
  p { margin: 4px 0; opacity: .85; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 12px 16px; position: sticky; top: 0; background: #0b2a1a; z-index: 2; }
  nav a { color: #0b2a1a; background: #8ddc0e; border-radius: 999px; padding: 4px 14px; text-decoration: none; font-weight: 700; }
  figure { scroll-margin-top: 110px; margin: 24px auto 48px; width: min(1280px, 100% - 32px); }
  figcaption { font-family: "Londrina Solid", sans-serif; font-size: 1.6rem; margin-bottom: 8px; }
  figcaption small { font-family: "Baloo 2", sans-serif; font-size: 1rem; opacity: .8; display: block; }
  object { width: 100%; aspect-ratio: 16 / 9; display: block; border-radius: 12px; background: #fff; }
</style>
</head>
<body>
<header>
  <h1>Smart Chain City — Modelos de telas</h1>
  <p>Wireframes de alta fidelidade baseados no kit de marca (HUD, inventário, diagramação) e no build 0.0.23.</p>
</header>
<nav id="nav"></nav>
<main id="list"></main>
<script>
  const telas = [
    ['01-login', 'Login', 'Cena ShowcaseLogin — carteira ou e-mail'],
    ['02-lucky-box', 'Lucky Box e seleção de avatar', 'Cena ShowcaseSelectAvatar — raridades e profissão'],
    ['03-cidade-hud', 'Cidade com HUD', 'Cena City — HUD superior, menu lateral e menus radiais'],
    ['04-inventario', 'Inventário de imóveis', 'Janela Inventário / Shop com cards T1–R3'],
    ['05-mapa-lotes', 'Mapa e compra de lote', 'Grade lote → célula → bairro, regras de posse'],
    ['06-turno-trabalho', 'Turno de trabalho', 'Minigame automático da profissão, danos e coleta'],
    ['07-marketplace', 'Marketplace no jogo', 'Ofertas de jogadores, filtros e compra'],
    ['08-exchange', 'Exchange THALER ↔ SCITY', 'Câmbio, limites e saque por voucher'],
  ];
  const nav = document.getElementById('nav'), list = document.getElementById('list');
  telas.forEach(([file, title, desc]) => {
    const a = document.createElement('a'); a.href = '#' + file; a.textContent = file.slice(0, 2) + ' ' + title; nav.append(a);
    const f = document.createElement('figure'); f.id = file;
    f.innerHTML = `<figcaption>${file.slice(0, 2)} — ${title}<small>${desc} · <a style="color:#8ddc0e" href="${file}.svg">abrir SVG</a></small></figcaption><object type="image/svg+xml" data="${file}.svg" aria-label="${title}"></object>`;
    list.append(f);
  });
</script>
</body>
</html>
